# t2fancurve configuration (whole numbers only)
# Restart the service after editing: sudo systemctl restart t2fancurve

# Temperature (°C) at or below which the fans run at their minimum speed
LOW_TEMP=60

# Temperature (°C) at or above which the fans run at their maximum speed
HIGH_TEMP=80

# Seconds between checks
INTERVAL=2

# Seconds over which the temperature is averaged, so that a short processor
# burst does not move the fans. 0 = use the raw reading.
SMOOTHING=6

# Fastest the fan speed may rise / fall, in rpm per second. 0 = no limit
# (jump straight to the new speed, the old behaviour).
RAMP_UP=200
RAMP_DOWN=100
